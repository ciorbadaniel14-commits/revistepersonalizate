<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlbumArt — Comenzi</title><link rel="stylesheet" href="/style.css"></head><body><nav><a class="logo" href="/">AlbumArt<small>ADMIN</small></a><a href="/">← Site</a></nav><section><h1 style="font:42px Georgia,serif">Comenzi AlbumArt</h1><p class="muted">Panou simplu pentru verificarea comenzilor primite.</p><div id="orders"></div></section><script>
async function load(){const r=await fetch("/api/orders");const orders=await r.json();const box=document.getElementById("orders");if(!orders.length){box.innerHTML="<div class='panel'>Nu există comenzi.</div>";return}box.innerHTML=orders.map(o=>`<div class="panel"><h3>#${o.id} · ${o.customer_name} · ${o.total} MDL</h3><p><b>Telefon:</b> ${o.phone} · <b>Email:</b> ${o.email||"-"}</p><p><b>Adresă:</b> ${o.delivery_address}</p><p><b>Album:</b> ${o.model} · <b>Material:</b> ${o.cover_material} · <b>Culoare:</b> ${o.cover_color} · <b>Format:</b> ${o.size} · <b>Pagini:</b> ${o.pages}</p><p><b>Text:</b> ${o.cover_text||"-"} · <b>Poze:</b> ${o.photos.length}</p><p>${o.photos.map(p=>`<a href="${p.url}" target="_blank">📷 ${p.original}</a>`).join(" · ")}</p><label>Status<select onchange="status(${o.id},this.value)">${["Noua","Confirmata","In lucru","Expediata","Finalizata","Anulata"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></label><small>${new Date(o.created_at).toLocaleString("ro-RO")}</small></div>`).join("")}
async function status(id,value){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:value})});load()}load();
</script></body></html>
